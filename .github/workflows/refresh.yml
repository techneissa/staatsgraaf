name: refresh

on:
  schedule:
    # Nightly at 03:00 UTC. GitHub runs scheduled workflows on the default branch.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Two refresh runs never overlap. A queued run waits instead of cancelling the active one.
concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh, validate, build, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Requires a committed root package-lock.json; see .github/workflows/README.md.
      - name: Install root dependencies
        run: npm ci

      - name: Merge research into the dataset
        run: npm run merge

      - name: Refresh news
        run: node pipelines/news.mjs

      - name: Refresh the change feed
        run: node pipelines/changes.mjs

      # From here the dataset must be valid before anything is built or deployed.
      # A failure below stops the run and production stays on the last good deployment.
      - name: Validate the dataset
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build the web app
        run: cd web && npm ci && npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://staatsgraaf.pages.dev' }}

      - name: Ensure the Cloudflare Pages project exists
        run: |
          if npx wrangler pages project list | grep -q 'staatsgraaf'; then
            echo "Pages project staatsgraaf already exists"
          else
            npx wrangler pages project create staatsgraaf --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy web/out --project-name=staatsgraaf --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # On any earlier failure, open or comment on a single ops issue. If the issue API is
      # unavailable, print the same summary so the failure is still visible in the log.
      - name: Report refresh failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          marker="Nachtelijke refresh mislukt"
          title="[ops] ${marker}"
          body="De nachtelijke refresh is mislukt.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Ref: ${{ github.ref }}
          Commit: ${{ github.sha }}

          Productie blijft op de laatste goede deployment. Onderzoek de run en los de oorzaak op."
          gh label create ops --force >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --search "${marker} in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}" || printf '%s\n' "${body}"
          else
            gh issue create --title "${title}" --label ops --body "${body}" || printf '%s\n' "${body}"
          fi
