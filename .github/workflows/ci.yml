name: ci

# Runs on a GitHub-hosted runner (ubuntu-24.04).
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: validate, research, test, typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      # Bun installs packages and runs the pipelines, the validator, and the tests.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Next.js and tsc still execute on Node; Bun's script runner honours their node shebang.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Validate the dataset
        run: bun run validate

      # Dates in documents are dd-MM-YYYY. Data and quoted values stay ISO.
      - name: Check date format in documents
        run: |
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./web/node_modules/*" \
            -not -path "./web/out/*" -not -path "./web/.next/*" -not -path "./research/raw/*" \
            -not -name "ATTRIBUTION.md" -print0 | xargs -0 python3 scripts/format-dates.py --check

      - name: Validate research
        run: bun run research:check

      # The root packages (the Anthropic SDK that pipelines/translate.mjs imports) are
      # not installed by the web step below.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test pipelines web/lib

      # Dry run of the refresh commit-back logic against a throwaway bare repository,
      # including the lost-race and conflict paths. No network.
      - name: Test the refresh commit script
        run: bash scripts/commit-refresh.test.sh

      # The contract manifest.json is generated by the web build, so the app
      # must build before the committed artifact can be verified.
      - name: Install, typecheck, and build the web app
        run: cd web && bun install --frozen-lockfile && bun run typecheck && bun run build

      # The committed /data/v1 artifact is the contract for every client. The
      # dataset files here are byte-copies of data/, so the contract must hold.
      - name: Contract check on the committed dataset
        run: bun run contract web/public/data/v1
