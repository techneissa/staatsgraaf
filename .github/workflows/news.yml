name: news

on:
  schedule:
    # Every six hours, offset from the nightly refresh at 03:00 UTC. Raise to hourly
    # ("0 * * * *") once the repository is public or the Actions minutes allow it;
    # see docs/adr/0007-news-outlets-and-languages.md.
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A news run never overlaps with itself or with the nightly refresh.
concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  news:
    name: news, validate, build, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Only the news feeds are refetched. Office holders and the change feed are the
      # nightly refresh's job, so this run stays short and cheap.
      - name: Refresh news
        run: bun run news

      - name: Validate the dataset
        run: bun run validate

      - name: Run tests
        run: bun test pipelines web/lib

      - name: Build the web app
        run: cd web && bun install --frozen-lockfile && bun run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://staatsgraaf.pages.dev' }}

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy web/out --project-name=staatsgraaf --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report news failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          marker="Nieuwsrun mislukt"
          title="[ops] ${marker}"
          body="De nieuwsrun is mislukt.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Ref: ${{ github.ref }}
          Commit: ${{ github.sha }}

          Productie blijft op de laatste goede deployment. Onderzoek de run en los de oorzaak op."
          gh label create ops --force >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --search "${marker} in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}" || printf '%s\n' "${body}"
          else
            gh issue create --title "${title}" --label ops --body "${body}" || printf '%s\n' "${body}"
          fi
