name: refresh

# The single scheduled workflow. Every 3 hours it refetches office holders and
# news, merges, translates, derives the change feed, validates and tests, and then:
#   - nothing changed: it stops here, successfully. No commit, no build, no deploy.
#   - something changed: it commits data/ to main as github-actions[bot] and, only
#     after that commit succeeded, builds and deploys to Cloudflare Pages.
# The file keeps the name news.yml; the nightly refresh.yml it replaces did nothing
# this run does not do (docs/adr/0004-hosting-ci-and-analytics.md, amendment 05-10-2026).
#
# Third-party actions are pinned to full commit SHAs, with the version they resolve
# to in a comment, because this repository is public.
on:
  schedule:
    # Every 3 hours, at 15 minutes past. GitHub documents that scheduled runs can be
    # delayed at the start of the hour, so the minute is not 0.
    - cron: "15 */3 * * *"
  workflow_dispatch:

# Least privilege by default; each job asks for what it needs.
permissions: {}

# A refresh never overlaps a deploy, a push deploy, or itself. A queued run waits.
concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh, validate, commit
    # Forks never run it, and it only publishes from the default branch.
    if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # push the data commit; no secret other than the translation keys is in this job
      issues: write # open the ops issue when a source is stopped by its guard
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Bun installs packages and runs the pipelines, the validator, and the tests.
      # Node is not needed here; only the deploy job builds the site.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Warm the Bun package cache so `bun install` stays a few seconds.
      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # One command refetches the official sources and applies what changed (ADR 0006 and
      # 0024): Tweede Kamer by change cursor, Eerste Kamer by page hash, the cabinet list
      # and the election dates. It checks the result for consistency before it writes
      # (150 and 75 seats, no seat twice, every member matched) and stops a source that
      # fails. Exit codes: 0 fine, also when nothing changed; 2 a source was stopped by
      # its guard (what passed is written and valid, and an ops issue is opened below);
      # anything else is a hard error and fails the run. `bun run merge` is not used here:
      # it is not safe on the committed dataset. research/raw is a local cache that the
      # pipelines create when it is missing.
      - name: Refresh official sources
        id: live
        run: |
          set +e
          bun run live
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 0 ] || [ "${code}" -eq 2 ]; then exit 0; fi
          exit "${code}"

      - name: Refresh news
        run: bun run news

      # Machine translation of new or changed news items (ADR 0016). The result lands
      # in data/ and is committed below; the Actions cache only seeds the next run
      # with items that were translated but not yet committed. Provider: OpenCode
      # (OPENCODE_API_KEY, Claude Haiku 5.5 on the pay-as-you-go endpoint), else DeepSeek direct (DEEPSEEK_API_KEY), else
      # Anthropic (ANTHROPIC_API_KEY); vars.TRANSLATE_PROVIDER and vars.TRANSLATE_MODEL
      # override. Without any key the step logs the backlog and exits 0; a translation
      # failure never fails the run.
      - name: Restore news translations cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: pipelines/.cache/translations
          key: news-translations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-translations-

      - name: Install pipeline dependencies
        run: bun install --frozen-lockfile

      - name: Translate new news items
        continue-on-error: true
        run: bun run translate --cache pipelines/.cache/translations/news-translations.json --max 400
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_PROVIDER: ${{ vars.TRANSLATE_PROVIDER }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}

      - name: Save news translations cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: pipelines/.cache/translations
          key: news-translations-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Refresh the change feed
        run: bun run changes

      # From here the dataset must be valid before anything is committed. A failure
      # below stops the run: nothing is committed, nothing is deployed, and production
      # stays on the last good deployment.
      - name: Validate the dataset
        run: bun run validate

      - name: Run tests
        run: bun test pipelines web/lib

      # Did anything change that matters? Timestamp-only differences (generatedAt) do not
      # count. See scripts/data-changed.mjs for the rule.
      - name: Check for changes
        id: changed
        run: bun scripts/data-changed.mjs data ATTRIBUTION.md research/P-live-ambtsdragers.json research/P-live-ambtsdragers.md research/P-live-state.json research/qa/live-review-queue.md research/merge-log.entries.jsonl

      # Commit to main as the bot. The script rebases and retries the push when another
      # push got there first, and fails on a real conflict (scripts/commit-refresh.sh).
      - name: Commit the refreshed data
        id: commit
        if: steps.changed.outputs.changed == 'true'
        run: bash scripts/commit-refresh.sh

      # A source stopped by its consistency guard is not a failed run: the other sources
      # were applied. It needs a person to look, so open or update one ops issue.
      - name: Report a stopped source
        if: steps.live.outputs.code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          marker="Bron gestopt door controle"
          title="[ops] ${marker}"
          body="Een officiële bron is door de consistentiecontrole gestopt (zie research/qa/live-run-latest.json in de run-uitvoer en research/qa/live-review-queue.md). De andere bronnen zijn wel verwerkt.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create ops --force >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --search "${marker} in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}" || printf '%s\n' "${body}"
          else
            gh issue create --title "${title}" --label ops --body "${body}" || printf '%s\n' "${body}"
          fi

  deploy:
    name: build and deploy
    needs: refresh
    if: ${{ needs.refresh.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # no write access to the repository while the site is built
    steps:
      # The commit the refresh job just pushed, so the site is built from what is on main.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.refresh.outputs.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Next.js and Wrangler still execute on Node.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # The Next.js build cache. The key has no data hash on purpose: a refresh changes
      # data/ on almost every run, and Next invalidates only the pages whose inputs
      # changed, so an older cache is still mostly valid. GitHub documents two limits
      # that shape this (docs.github.com, "Dependency caching reference", read
      # 05-10-2026): a cache is never rewritten once its key exists ("You cannot change
      # the contents of an existing cache"), and the repository cap is 10 GB, with
      # entries not accessed for 7 days evicted. A key of only the lockfile hash would
      # freeze the cache at its first build, and a key per run would fill the 10 GB cap
      # and evict the translation cache. So the key adds the ISO week: one fresh entry
      # per week, older weeks serve as the restore-keys fallback. The step runs only in
      # this job, so a cache is saved only when a build actually ran.
      - name: Compute the cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache the Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-
            next-${{ runner.os }}-

      # The checkout may include commits that landed after the refresh job validated
      # (the push rebases on newer ones), so validate the tree that is actually built.
      - name: Validate the dataset
        run: bun run validate

      - name: Build the web app
        run: cd web && bun install --frozen-lockfile && bun run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://staatsgraaf.pages.dev' }}

      # The built /data/v1 artifact is the contract every client decodes. A break
      # here stops the run before anything is published.
      - name: Contract check on the built dataset
        run: bun run contract web/out/data/v1

      - name: Ensure the Cloudflare Pages project exists
        run: |
          if bunx wrangler pages project list | grep -q 'staatsgraaf'; then
            echo "Pages project staatsgraaf already exists"
          else
            bunx wrangler pages project create staatsgraaf --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy web/out --project-name=staatsgraaf --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # On any failure above, open or comment on a single ops issue. If the issue API is
  # unavailable, print the same summary so the failure is still visible in the log.
  report-failure:
    name: report failure
    needs: [refresh, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report refresh failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          marker="Refresh mislukt"
          title="[ops] ${marker}"
          body="De geplande refresh is mislukt.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Ref: ${{ github.ref }}
          Commit: ${{ github.sha }}

          Productie blijft op de laatste goede deployment. Onderzoek de run en los de oorzaak op."
          gh label create ops --force >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --search "${marker} in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}" || printf '%s\n' "${body}"
          else
            gh issue create --title "${title}" --label ops --body "${body}" || printf '%s\n' "${body}"
          fi
