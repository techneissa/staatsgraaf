name: news

on:
  schedule:
    # Hourly during the Dutch day (06:15 to 23:15 CEST) plus one overnight run; the
    # nightly refresh at 03:00 UTC covers the rest. Not every hour around the clock
    # because the repository is private and Actions minutes are capped; a run takes
    # about 3 minutes. Full hourly ("15 * * * *") is one line away once the
    # repository is public; see docs/adr/0007-news-outlets-and-languages.md.
    - cron: "15 4-21 * * *"
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A news run never overlaps with itself or with the nightly refresh.
concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  news:
    name: news, validate, build, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Warm the Bun package cache so `bun install` stays a few seconds.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Reuse Next.js build artifacts. The restore key ignores the data hash on
      # purpose: a news run changes news data every time, and Next invalidates only
      # the pages whose inputs actually changed.
      - name: Cache the Next.js build
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-${{ hashFiles('data/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-
            next-${{ runner.os }}-

      # Only the news feeds are refetched. Office holders and the change feed are the
      # nightly refresh's job, so this run stays short and cheap.
      - name: Refresh news
        run: bun run news

      # Machine translation of new or changed news items (ADR 0016). Translations
      # made here are not committed, so they persist between runs in the Actions
      # cache: restore the newest copy, merge it with the committed file, send only
      # items whose hash does not match yet, and save the result under a new key.
      # Provider: OpenCode Zen (OPENCODE_API_KEY, DeepSeek), else DeepSeek direct
      # (DEEPSEEK_API_KEY), else Anthropic (ANTHROPIC_API_KEY); vars.TRANSLATE_PROVIDER
      # and vars.TRANSLATE_MODEL override. Without any key the step logs the backlog and exits 0;
      # a translation failure never fails the run.
      - name: Restore news translations cache
        uses: actions/cache/restore@v4
        with:
          path: pipelines/.cache/translations
          key: news-translations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-translations-

      - name: Install pipeline dependencies
        run: bun install --frozen-lockfile

      - name: Translate new news items
        continue-on-error: true
        run: bun run translate --cache pipelines/.cache/translations/news-translations.json --max 400
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_PROVIDER: ${{ vars.TRANSLATE_PROVIDER }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}

      - name: Save news translations cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: pipelines/.cache/translations
          key: news-translations-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate the dataset
        run: bun run validate

      - name: Run tests
        run: bun test pipelines web/lib

      - name: Build the web app
        run: cd web && bun install --frozen-lockfile && bun run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://staatsgraaf.pages.dev' }}

      # The built /data/v1 artifact is the contract every client decodes. A break
      # here stops the news run before anything is published.
      - name: Contract check on the built dataset
        run: bun run contract web/out/data/v1

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy web/out --project-name=staatsgraaf --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report news failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          marker="Nieuwsrun mislukt"
          title="[ops] ${marker}"
          body="De nieuwsrun is mislukt.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Ref: ${{ github.ref }}
          Commit: ${{ github.sha }}

          Productie blijft op de laatste goede deployment. Onderzoek de run en los de oorzaak op."
          gh label create ops --force >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --search "${marker} in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}" || printf '%s\n' "${body}"
          else
            gh issue create --title "${title}" --label ops --body "${body}" || printf '%s\n' "${body}"
          fi
