name: deploy

# A push to main builds and deploys the committed dataset. It does not refetch
# office holders or news; that is the scheduled refresh (news.yml, every 3 hours).
# Use this workflow to publish a code or data change without waiting for the
# schedule. Pushes that only touch documentation do not build (paths-ignore).
#
# The refresh workflow pushes its own data commits with GITHUB_TOKEN. GitHub does not
# start new workflow runs for events caused by that token, so those commits never
# trigger this workflow; the refresh run deploys them itself.
#
# Third-party actions are pinned to full commit SHAs, with the version in a comment.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "research/qa/**"
      - "**/*.md"
      - ".github/workflows/README.md"
      # research/*.json is not ignored: web/scripts/build-search-index.mjs reads it.
      # LICENSE and LICENSE-DATA are not ignored: the build serves them as /data/v1/LICENSE*.txt.
  workflow_dispatch:

permissions: {}

# Shares the deploy lock with the scheduled refresh, so two deployments never
# overlap. A newer run waits; GitHub keeps only the newest pending run per group.
concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      # Bun installs packages and runs the validator and the tests.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Next.js and Wrangler still execute on Node.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # The Next.js build cache, keyed like the refresh workflow so both share entries.
      # Why the key has no data hash and an ISO week: see the comment in news.yml
      # (GitHub never rewrites an existing cache key; the repository cap is 10 GB and
      # entries idle for 7 days are evicted).
      - name: Compute the cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache the Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}-
            next-${{ runner.os }}-

      # The dataset is committed, so this run only gates on it.
      - name: Validate the dataset
        run: bun run validate

      # The root packages (the Anthropic SDK that pipelines/translate.mjs imports) are
      # not installed by the web step below.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test pipelines web/lib

      - name: Build the web app
        run: cd web && bun install --frozen-lockfile && bun run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://staatsgraaf.pages.dev' }}

      # The built /data/v1 artifact is the contract every client decodes. A break
      # here fails the deploy before anything is published.
      - name: Contract check on the built dataset
        run: bun run contract web/out/data/v1

      - name: Deploy to Cloudflare Pages
        run: bun scripts/pages-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  report-failure:
    name: report failure
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report deploy failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          marker="Deploy mislukt"
          title="[ops] ${marker}"
          body="De deploy van een push naar main is mislukt.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Ref: ${{ github.ref }}
          Commit: ${{ github.sha }}

          Productie blijft op de laatste goede deployment. Onderzoek de run en los de oorzaak op."
          gh label create ops --force >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --search "${marker} in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}" || printf '%s\n' "${body}"
          else
            gh issue create --title "${title}" --label ops --body "${body}" || printf '%s\n' "${body}"
          fi
